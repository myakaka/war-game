<script data-src="js/ai-intel.js">
'use strict';
/* =====================================================================
   AI 정보 모듈 (대칭 시나리오의 AI 전용, aiProfile 'symmetric').
   규칙 엔진 상태를 읽기만 하는 순수 함수. 난수 없음 (같은 상태 → 같은 결과).
   안개: 진영이 본 것(state.memory), 공개 정보(시나리오 시작 배치·간접 화력 설정), 자기 유닛이 맞은 피해 모양만 쓴다.
         상대의 실제 위치·체력·쿨다운·증원 현황(state.pending)은 읽지 않는다.
   상태에 남기는 것: state.aiIntel (대칭 시나리오만. 다른 시나리오에는 필드가 생기지 않음)
     aiIntel[side] = { gone: { 상대 시작 유닛 id: true }, clues: [{ round, kind: 'artillery'|'mortar'|null }] }
   engine.js 다음에 불러온다 (엔진 함수·상수를 그대로 씀).
   ===================================================================== */

/** 이 시나리오에서 정보 모듈을 쓰는가 */
const intelOn = () => GAME_CONFIG.AI_MODE === 'symmetric';

/** 게임 시작 시 (createInitialState) */
function intelInit(state) {
  if (!intelOn()) return;
  state.aiIntel = {};
  for (const side of GAME_CONFIG.ROUND_ORDER) state.aiIntel[side] = { gone: {}, clues: [] };
}

/** 상대 시작 배치 (공개 설정): [{ id, type, r, c }] (createInitialState 의 id 규칙) */
function intelSetupOf(enemy) {
  const prefix = enemy[0].toUpperCase();
  return GAME_CONFIG.DEPLOYMENT[enemy].map((d, i) => ({ id: prefix + (i + 1), type: d.type, r: d.r, c: d.c }));
}

/**
 * 시야 갱신 (updateMemory 끝에서, 행동마다). 아직 한 번도 못 본 상대 시작 유닛의 시작 칸이 보이면 그 기록은 지움 (gone)
 * memory 쪽은 기존 규칙 그대로 (보이면 덮어씀, 보이는 칸이 비면 vacated → 정보 모듈에서는 지운 것으로 봄)
 */
function intelOnVision(state) {
  if (!state.aiIntel) return;
  for (const side of GAME_CONFIG.ROUND_ORDER) {
    const I = state.aiIntel[side];
    if (!I) continue;
    const vis = getVisibleTiles(state, side), mem = state.memory[side];
    for (const s of intelSetupOf(enemyOf(side))) {
      if (I.gone[s.id] || mem[s.id]) continue;
      if (vis.has(idx(s.r, s.c))) I.gone[s.id] = true;
    }
  }
}

/**
 * 간접 사격 단서 (resolveAttack 끝에서). 맞은 진영이 볼 수 있는 것만으로 판단:
 * 표적 칸이 그 진영 시야 안이고 쏜 유닛이 보이지 않으면 '보이지 않는 곳에서 온 간접 사격'.
 * 병종 추정: 쏜 유닛이 보이면 그 병종. 아니면 인접 칸 파편 피해 또는 중심 피해 2 이상 → 포병, 중심 피해 1·파편 없음 → 모름 (둘 다 가능)
 */
function intelOnIndirectFire(state, attacker, target, events) {
  if (!state.aiIntel) return;
  const victim = enemyOf(attacker.side);
  const I = state.aiIntel[victim];
  if (!I) return;
  const vis = getVisibleTiles(state, victim);
  if (!vis.has(idx(target.r, target.c))) return;
  let kind = null;
  if (vis.has(idx(attacker.r, attacker.c))) kind = attacker.type;
  else {
    const splash = events.some((e) => e.type === 'splashDamage');
    const center = events.find((e) => e.type === 'damage');
    if (splash || (center && center.amount >= 2)) kind = 'artillery';
  }
  I.clues.push({ round: state.round, kind });
  if (I.clues.length > 12) I.clues.shift();
}

/** 상대가 가진 간접 화력 병종 수 (공개 설정: 시작 배치 + 증원 일정) − 직접 보고 확인한 파괴 */
function intelEnemyCount(state, side, type) {
  const enemy = enemyOf(side);
  const C = GAME_CONFIG;
  let n = C.DEPLOYMENT[enemy].filter((d) => d.type === type).length
    + C.REINFORCEMENTS.filter((g) => g.side === enemy && g.type === type).reduce((k, g) => k + g.count, 0);
  const dead = (state.intel && state.intel[side] && state.intel[side].destroyed) || {};
  const mem = state.memory[side];
  for (const id of Object.keys(dead)) {
    const known = mem[id] || intelSetupOf(enemy).find((s) => s.id === id);
    if (known && known.type === type) n--;
  }
  return Math.max(0, n);
}

/**
 * 상대 포병이 다음 상대 턴에 쉬는가 (쿨다운 추정). 확신할 때만 true:
 * 상대 포병이 1기뿐이고(공개 설정 − 확인한 파괴), 상대의 가장 최근 턴에 포병 사격 단서가 있고, 쿨다운이 1 이상.
 */
function intelArtyResting(state, side) {
  const I = state.aiIntel && state.aiIntel[side];
  if (!I) return false;
  const enemy = enemyOf(side);
  const f = firesOf(state, enemy);
  if (!f || !f.artillery || !(f.artillery.cooldown >= 1)) return false;
  if (intelEnemyCount(state, side, 'artillery') !== 1) return false;
  const order = GAME_CONFIG.ROUND_ORDER;
  // 상대의 가장 최근 턴 라운드 (지금이 내 턴이라고 볼 때)
  const last = order.indexOf(enemy) < order.indexOf(side) ? state.round : state.round - 1;
  return I.clues.some((c) => c.round === last && c.kind === 'artillery');
}

/**
 * 본 적 기억: [{ id, type, r, c, hp, age, conf, radius, seen }]
 *   seen: 지금 보임. age: 마지막으로 본 뒤 지난 라운드. conf: 신뢰도 (DECAY^age). radius: 불확실 반경 (이동력 × age, 칸)
 *   기록 = 기억(vacated 제외) + (intelFromSetup) 아직 못 본 상대 시작 유닛 (본 라운드 0)
 */
function intelRecords(state, side, K) {
  const enemy = enemyOf(side);
  const mem = state.memory[side];
  const dead = (state.intel && state.intel[side] && state.intel[side].destroyed) || {};
  const vis = getVisibleTiles(state, side);
  const out = [];
  const add = (id, type, r, c, hp, seenRound, seen) => {
    const age = seen ? 0 : Math.max(0, state.round - seenRound);
    const ty = GAME_CONFIG.UNIT_TYPES[type];
    out.push({ id, type, r, c, hp, age, seen, conf: Math.pow(K.CONF_DECAY, age), radius: Math.min(K.RADIUS_CAP, ty.move * age) });
  };
  for (const m of Object.values(mem)) {
    if (m.vacated || dead[m.id]) continue;
    const seen = vis.has(idx(m.r, m.c));
    add(m.id, m.type, m.r, m.c, m.hp, m.round, seen);
  }
  if (K.INTEL_FROM_SETUP && state.aiIntel && state.aiIntel[side]) {
    const gone = state.aiIntel[side].gone;
    for (const s of intelSetupOf(enemy)) {
      if (mem[s.id] || dead[s.id] || gone[s.id]) continue;
      add(s.id, s.type, s.r, s.c, GAME_CONFIG.MAX_HP, 0, false);
    }
  }
  out.sort((a, b) => a.id.localeCompare(b.id, 'en', { numeric: true }));
  return out;
}

const _reachCache = new Map();
/**
 * (r,c) 에서 지형 이동 비용(AI PATH_COST, 진입 불가 지형 제외)으로 reach 이하인 칸 → 비용. 버킷 큐 (비용은 작은 정수)
 * distanceField 와 같은 비용표를 쓰되 reach 에서 멈춤 (계산 시간)
 */
function reachCells(type, r0, c0, reach) {
  const key = `${GAME_CONFIG.SCENARIO_ID}|${type}|${r0},${c0}|${reach}`;
  let out = _reachCache.get(key);
  if (out) return out;
  const PC = GAME_CONFIG.AI.PATH_COST;
  const cost = new Map([[r0 * N + c0, 0]]);
  const buckets = [[r0 * N + c0]];
  for (let d = 0; d <= reach; d++) {
    for (const i of buckets[d] || []) {
      if (cost.get(i) !== d) continue;
      const r = Math.floor(i / N), c = i % N;
      for (const [dr, dc] of DIRS) {
        const nr = r + dr, nc = c + dc;
        if (!inBounds(nr, nc)) continue;
        const ter = terrainAt(nr, nc);
        if (ter.impassableFor && ter.impassableFor.includes(type)) continue;
        const nd = d + (PC[ter.key] ?? ter.moveCost);
        const ni = nr * N + nc;
        if (nd > reach || (cost.has(ni) && cost.get(ni) <= nd)) continue;
        cost.set(ni, nd);
        (buckets[nd] || (buckets[nd] = [])).push(ni);
      }
    }
  }
  out = [...cost.entries()];
  if (_reachCache.size > 2000) _reachCache.clear();
  _reachCache.set(key, out);
  return out;
}

/** 기록 하나의 위치 불확실성에 따른 가중치 (0~1): 신뢰도 × 1/(1 + SPREAD × 반경) */
const intelWeight = (e, K) => e.conf / (1 + K.SPREAD * e.radius);

/**
 * 위험 지도: 다음 상대 턴에 그 칸에 서 있는 defType 아군(최대 체력 기준)이 받을 기대 피해.
 * { dmg: 칸별 기대 피해 합, direct: 그중 직접 공격 몫, artyP: 칸별 '포병이 이 칸을 노려 명중할' 가중 확률 (인접 파편 계산용) }
 * 간접: 사거리(+불확실 반경, 박격포는 이동력도) 안. 포병이 쉬는 것으로 추정되면 포병 항 없음.
 * 직접: 지형 비용 거리 ≤ 이동력 + 반경 + 1. 명중률은 calcHitBreakdown (상대는 그 칸을 본다고 가정해 보수적으로)
 */
function threatMap(state, side, defType, K, records = null, resting = null) {
  const recs = records || intelRecords(state, side, K);
  const rest = resting == null ? intelArtyResting(state, side) : resting;
  const enemy = enemyOf(side);
  const NN = N * N;
  const dmg = new Float64Array(NN), direct = new Float64Array(NN), artyP = new Float64Array(NN);
  const def = { type: defType, hp: GAME_CONFIG.MAX_HP, side };
  const UT = GAME_CONFIG.UNIT_TYPES;
  // 명중률은 지형과 이동 후 공격 여부에만 달라짐 → 기록마다 (지형, 이동 후) 조합으로 한 번만 계산
  const hitOf = (att, moved, pen, memo, r, c) => {
    const ter = terrainAt(r, c), k = ter.key + (moved ? '1' : '0');
    let v = memo.get(k);
    if (v == null) {
      v = calcHitBreakdown({ attacker: att, defender: def, terrain: ter, signal: false, fogged: false, movedAttack: moved, indirectPenalty: pen }).chance / 100;
      memo.set(k, v);
    }
    return v;
  };
  for (const e of recs) {
    const et = UT[e.type];
    if (!et.canAttack) continue;
    const w = intelWeight(e, K);
    if (w < K.MIN_WEIGHT) continue;
    const att = { type: e.type, hp: e.hp, side: enemy };
    if (et.indirect) {
      if (e.type === 'artillery' && rest) continue;
      const R = fireRange(state, enemy, e.type);
      const slack = e.radius + (et.moveFire ? et.move : 0);
      const lo = Math.max(0, R.min - slack), hi = R.max + slack;
      const f = firesOf(state, enemy);
      const pen = f && f[e.type] && f[e.type].indirectPenalty ? f[e.type].indirectPenalty : 0;
      const amount = et.fixedDamage != null ? et.fixedDamage : calcDamage(att, def);
      const memo = new Map();
      for (let r = Math.max(0, e.r - hi); r <= Math.min(N - 1, e.r + hi); r++) for (let c = 0; c < N; c++) {
        const d = Math.abs(r - e.r) + Math.abs(c - e.c);
        if (d < lo || d > hi) continue;
        const i = r * N + c;
        const p = hitOf(att, !!et.moveFire && d > R.max, pen, memo, r, c) * w;
        dmg[i] += p * amount;
        if (et.splash !== false) artyP[i] += p;
      }
    } else {
      const reach = et.move + e.radius + 1;
      const amount = calcDamage(att, def);
      const memo = new Map();
      for (const [i, cost] of reachCells(e.type, e.r, e.c, reach)) {
        const v = hitOf(att, cost > 1, 0, memo, Math.floor(i / N), i % N) * w * amount;
        dmg[i] += v;
        direct[i] += v;
      }
    }
  }
  return { dmg, direct, artyP };
}

/**
 * 내가 u 를 pos 에 두었을 때의 기대 손실 비율 (0~1, 체력 대비). maps: 병종별 threatMap 을 돌려주는 함수.
 * 포병 파편: 인접 칸의 아군이 포병 표적이 되면 이 유닛도 파편 피해 (그 표적 확률의 절반으로 셈)
 */
function expectedLoss(state, side, u, pos, maps) {
  const m = maps(u.type);
  const i = idx(pos.r, pos.c);
  let d = m.dmg[i];
  const splash = GAME_CONFIG.COMBAT.splashDamage;
  for (const [dr, dc] of DIRS) {
    const r = pos.r + dr, c = pos.c + dc;
    if (!inBounds(r, c)) continue;
    const a = getUnitAt(state, r, c);
    if (a && a.side === side && a.id !== u.id) d += 0.5 * m.artyP[idx(r, c)] * splash;
  }
  return Math.min(1, d / Math.max(1, u.hp));
}

/**
 * 위협 점수: 그 적이 다음 턴에 거점이나 아군에게 줄 수 있는 기대 피해 × 거점에 가까운 정도 × 신뢰도.
 * objCells: 거점 칸 목록. 가까운 정도 = max(0, 1 − 거리/(이동력 + 사거리 + 3))
 */
function threatScore(e, objCells, K) {
  const et = GAME_CONFIG.UNIT_TYPES[e.type];
  if (!et.canAttack) return 0;
  let d = Infinity;
  for (const p of objCells) d = Math.min(d, Math.abs(p.r - e.r) + Math.abs(p.c - e.c));
  const reach = et.move + et.rangeMax + 3;
  const near = Math.max(0, 1 - d / reach);
  const power = Math.max(et.atkSoft, et.atkArmor) / 6;   // 0~1 근사 (가장 강한 공격력 6 기준)
  return power * near * intelWeight(e, K) * (e.hp / GAME_CONFIG.MAX_HP + 0.5);
}

/* =====================================================================
   새 대칭 AI (v2) 점수 항목. engine.js 의 aiScorePosition·aiScoreAttack·aiArtilleryTargets·aiNeutralGoals 가
   ctx.v2 가 있을 때만 부른다 (기존 점수에 더하는 방식). 설정: AI_CONFIG.SYMMETRIC.INTEL / V2
   ===================================================================== */
const _threatCache = new Map();   // 위험 지도 캐시 (키 = 진영·병종·기억 요약·포병 휴식·간접 화력 설정)
/** 시나리오가 바뀔 때 비움 (loadScenario): 캐시 키에 지도 크기·지형이 없으므로 다른 지도의 값이 섞이지 않게. 결과 값은 같음 (메모일 뿐) */
function intelClearCaches() { _threatCache.clear(); _reachCache.clear(); _objNear = null; }

/**
 * 압박 0~1: 승리 조건(시나리오 데이터)에서 계산. 라운드가 갈수록, 점유 거점이 상대보다 적을수록 큼.
 * roundLimitScore 가 있으면 남은 라운드와 점유 차이, roundLimitPoints 면 남은 라운드와 예상 총점 차이(지금 점수 + 지금 점유 점수 × 남은 라운드),
 * 상대에게 holdObjectives 가 있으면 상대가 필요 수에 가까울수록, scoreTarget 이 있으면 상대가 목표에 가까울수록
 */
function symUrgency(state, side) {
  const C = GAME_CONFIG, enemy = enemyOf(side);
  const mine = state.objectives.filter((o) => o.owner === side).length;
  const theirs = state.objectives.filter((o) => o.owner === enemy).length;
  let u = 0;
  const timeP = C.MAX_ROUNDS > 1 ? Math.min(1, Math.max(0, (state.round - 1) / (C.MAX_ROUNDS - 1))) : 1;
  const limit = roundLimitType();
  if (limit === 'roundLimitScore') {
    const behind = theirs > mine ? 1 : theirs === mine ? 0.5 : 0;
    u = timeP * (0.3 + 0.7 * behind);
  } else if (limit === 'roundLimitPoints' && state.score) {
    const left = C.MAX_ROUNDS - state.round + 1;
    const proj = (s) => state.score[s] + heldPoints(state, s).pts * left;   // 총점·점유는 공개 정보
    const behind = proj(enemy) > proj(side) ? 1 : proj(enemy) === proj(side) ? 0.5 : 0;
    u = timeP * (0.3 + 0.7 * behind);
    if (C.SCORE_TARGET && state.score[enemy] + 2 * heldPoints(state, enemy).pts >= C.SCORE_TARGET) u = Math.max(u, 0.7);
  }
  const hold = victoryCond(enemy, 'holdObjectives');
  if (hold && theirs >= hold.count - 1) u = Math.max(u, 0.7);
  return Math.min(1, u);
}

let _objNear = null;
/** 거점 칸에서 3칸 안의 칸 집합 (시나리오마다 한 번) + 칸별 가장 가까운 거점 칸 거리 */
function symObjNear(objCells) {
  if (_objNear && _objNear.id === GAME_CONFIG.SCENARIO_ID && _objNear.n === N) return _objNear.set;
  const set = new Set(), dist = new Int16Array(N * N);
  for (let i = 0; i < N * N; i++) {
    const r = Math.floor(i / N), c = i % N;
    let d = 99;
    for (const q of objCells) d = Math.min(d, Math.abs(q.r - r) + Math.abs(q.c - c));
    dist[i] = d;
    if (d <= 3) set.add(i);
  }
  set.dist = dist;
  _objNear = { id: GAME_CONFIG.SCENARIO_ID, n: N, set };
  return set;
}

function symV2Context(state, side, level, ctx) {
  const S = GAME_CONFIG.AI.SYMMETRIC, K = S.INTEL, V = S.V2, L = V.LEVELS[level] || V.LEVELS.normal;
  const enemy = enemyOf(side);
  const records = intelRecords(state, side, K);
  const resting = intelArtyResting(state, side);
  const sig = `${side}|${state.round}|${resting ? 1 : 0}|${JSON.stringify(firesOf(state, enemy))}|` + records.map((e) => `${e.id}:${e.r},${e.c},${e.age},${e.hp}`).join(';');
  const maps = (type) => {
    const key = sig + '|' + type;
    let m = _threatCache.get(key);
    if (!m) {
      m = threatMap(state, side, type, K, records, resting);
      if (_threatCache.size > 64) _threatCache.clear();
      _threatCache.set(key, m);
    }
    return m;
  };
  const urgency = symUrgency(state, side);
  const objCells = state.objectives.flatMap((o) => objectiveCells(o));
  const objNear = symObjNear(objCells);
  // 아군 포병(파편 있음)이 지금 쏠 수 있는 보이는 표적의 인접 칸 = 비켜 주면 좋은 칸 (값 = 표적 가치)
  const lanes = new Map();
  for (const a of ctx.allies) {
    const at = unitType(a);
    if (!at.indirect || at.splash === false || a.acted || !canUnitAttack(state, a)) continue;
    for (const e of ctx.visibleEnemies) {
      if (!inFireRange(state, a, a, e)) continue;
      const v = GAME_CONFIG.AI.UNIT_VALUE[e.type];
      for (const [dr, dc] of DIRS) {
        const r = e.r + dr, c = e.c + dc;
        if (inBounds(r, c)) lanes.set(idx(r, c), Math.max(lanes.get(idx(r, c)) || 0, v));
      }
    }
  }
  const recById = new Map(records.map((e) => [e.id, e]));
  return {
    K, V, L, records, recById, resting, maps, urgency, objCells, objNear, lanes,
    riskW: L.riskWeight * (1 - V.urgencyRelief * urgency),
    minSupport: urgency > 0.85 ? 0 : urgency > 0.6 ? Math.max(0, L.minSupport - 1) : L.minSupport,
  };
}

/** 반격 목표: 거점 칸에서 counterRadius 안에 있는 (최근 본) 적. 전투 유닛(직접 공격)만 */
function symV2Goals(state, ctx, u, goals) {
  const t = unitType(u), X = ctx.v2;
  if (!t.canAttack || t.indirect) return;
  for (const e of X.records) {
    if (e.age > 1) continue;
    let d = Infinity;
    for (const q of X.objCells) d = Math.min(d, manhattan(e, q));
    if (d <= X.V.counterRadius) goals.push({ r: e.r, c: e.c });
  }
}

/** 위치 점수 추가 항목 */
function symV2Position(state, ctx, u, pos) {
  const X = ctx.v2, V = X.V, t = unitType(u), side = u.side;
  const moving = !samePos(pos, u);
  let s = 0;
  // 위험: 그 칸에 두었을 때 기대 손실 비율 × 가중 (포병·박격포·통신, 체력 낮은 유닛은 더 크게)
  const loss = expectedLoss(state, side, u, pos, X.maps);
  const mult = GAME_CONFIG.AI.UNIT_VALUE[u.type] * (t.indirect || t.isSignal ? V.supportValue : 1) * (u.hp <= 2 ? V.lowHpMult : 1);
  s -= X.riskW * mult * loss;
  // 집결 후 진입: 위험한 칸에 혼자 들어가지 않음 (지원 가능한 아군 수, 상대 포병 휴식 추정, 압박)
  if (moving && X.L.gatePenalty && loss >= X.L.highRisk && !t.indirect && !X.resting) {
    let support = 0;
    for (const a of ctx.allies) {
      if (a.id === u.id) continue;
      const at = unitType(a);
      if (at.canAttack && !at.indirect && manhattan(a, pos) <= at.move + 1) support++;
    }
    if (support < X.minSupport) s -= X.L.gatePenalty;
  }
  // 포병·박격포·통신: 직접 공격 위험이 있는 칸 피함 (보병 뒤쪽 유지)
  if (t.indirect || t.isSignal) s -= V.rearDirect * X.maps(u.type).direct[idx(pos.r, pos.c)];
  // 포병·박격포: 다음 턴에 쏠 수 있는 곳 — 사거리 안의 거점 칸(내가 점유하지 않은 곳)과 기억한 적
  if (t.indirect) {
    const R = fireRange(state, side, u.type);
    const inR = (p) => { const d = manhattan(pos, p); return d >= R.min && d <= R.max; };
    let cells = 0, recs = 0, near = Infinity;
    for (const o of state.objectives) if (o.owner !== side) for (const q of objectiveCells(o)) { if (inR(q)) cells++; near = Math.min(near, manhattan(pos, q)); }
    if (isFinite(near)) s -= V.artyReach * Math.max(0, near - R.max);   // 사거리 밖이면 거점 쪽으로 (사거리 안에 들 때까지)
    for (const e of X.records) if (inR(e)) recs += intelWeight(e, X.K);
    s += V.artyCover * Math.min(4, cells) + V.artyIntelCover * Math.min(3, recs);
    // 거점 칸 위는 보병 몫: 간접 화력 유닛은 점령·유지 점수를 대부분 덜어 냄 (앞줄에 서지 않게)
    const o = objectiveAt(state, pos.r, pos.c);
    if (o) s -= V.indirectHoldCut * (o.owner !== side ? GAME_CONFIG.AI.WEIGHTS.capture : GAME_CONFIG.AI.SYMMETRIC.HOLD);
  }
  s -= symV2RetreatRisk(state, ctx, u, pos, loss, mult);   // 한 번 맞으면 물러날 곳이 없는 칸·제압 위험 (retreat 규칙이 켜진 시나리오만)
  // 최소 수비: 점유 중인 거점의 마지막 수비 유닛은 떠나지 않음
  const o0 = objectiveAt(state, u.r, u.c);
  if (o0 && o0.owner === side && moving) {
    const cells = objectiveCells(o0);
    if (!cells.some((q) => samePos(q, pos))) {
      const others = cells.filter((q) => { const a = getUnitAt(state, q.r, q.c); return a && a.side === side && a.id !== u.id; }).length;
      if (others < V.minGarrison) s -= V.garrisonLeave;
    }
  }
  // 추격 제한: 전투 유닛이 거점에서 leashRadius 넘게 멀어지는 이동
  if (moving && t.canAttack && !t.indirect && u.type !== 'recon') {
    const d0 = X.objNear.dist[idx(u.r, u.c)], d1 = X.objNear.dist[idx(pos.r, pos.c)];
    if (d1 > V.leashRadius && d1 > d0) s -= V.leash * (d1 - Math.max(d0, V.leashRadius));
  }
  // 아군 포병 표적 옆에서 비켜 주기 (그다음 사격이 오폭 감점 없이 가능해짐)
  const here = X.lanes.get(idx(u.r, u.c)) || 0, there = X.lanes.get(idx(pos.r, pos.c)) || 0;
  if (moving) s += V.clearLane * (here - there);
  // 정찰: 거점 접근로(거점 3칸 안)의 안 보이던 칸을 새로 봄
  if (u.type === 'recon') {
    let fresh = 0;
    const v = t.vision;
    for (let dr = -v; dr <= v; dr++) {
      const rem = v - Math.abs(dr);
      for (let dc = -rem; dc <= rem; dc++) {
        const r = pos.r + dr, c = pos.c + dc;
        if (inBounds(r, c) && X.objNear.has(idx(r, c)) && !ctx.vis.has(idx(r, c))) fresh++;
      }
    }
    s += V.reconWatch * fresh;
  }
  return s;
}

/* ---------- 후퇴·제압 규칙을 아는 점수 항목 (모든 시나리오 공통 모듈, 규칙 v12) ----------
 * 대칭 AI(v2)와 호스토멜·춘천의 기존 AI 가 같은 함수를 쓴다. 가중치 세트만 다르다 (V2 / AI_CONFIG.WEIGHTS).
 * AI 가 쓰는 정보: 지형(공개), 맵 크기, 자기 유닛, 내 시야 안의 적 유닛, 내가 이번 턴에 제압한 유닛 id (내 사격 결과).
 * 안 보이는 칸은 비어 있다고 가정하고, 적의 제압 상태·체력 밖의 숨은 정보는 읽지 않는다.
 */
/** victim 이 dir 방향으로 후퇴할 때의 결과 { dies, to }: 규칙(retreatTarget)과 같은 판정이지만 아는 유닛만 본다 */
function symRetreatOutcome(state, ctx, aiSide, victim, dir) {
  const R = GAME_CONFIG.RETREAT;
  let r = victim.r, c = victim.c;
  for (let k = 0; k < R.STEPS; k++) {
    r += dir[0]; c += dir[1];
    for (;;) {
      if (!inBounds(r, c)) return { dies: true };
      const ter = terrainAt(r, c);
      if (ter.impassableFor && ter.impassableFor.includes(victim.type)) return { dies: true };
      const o = getUnitAt(state, r, c);
      const known = o && o.id !== victim.id && (o.side === aiSide || ctx.vis.has(idx(r, c)));
      if (!known) break;
      if (o.side !== victim.side) return { dies: true };
      r += dir[0]; c += dir[1];
    }
  }
  return { dies: false, to: { r, c } };
}

/** 내가 이번 턴에 제압한 적 유닛인가 (내 사격 결과로 안 것) */
function symKnowsSuppressed(state, side, unitId) {
  const sp = suppMemory(state, side, false);
  return !!sp && sp[unitId] === state.round && state.turn === side;
}
/** 진영별 '내가 제압한 유닛 id → 라운드' 기억. 대칭 시나리오는 state.aiIntel[side].supp, 그 밖은 state.aiSupp[side] (create 가 true 일 때만 만듦) */
function suppMemory(state, side, create) {
  if (state.aiIntel && state.aiIntel[side]) { const ai = state.aiIntel[side]; return create ? (ai.supp || (ai.supp = {})) : (ai.supp || null); }
  if (!create) return (state.aiSupp && state.aiSupp[side]) || null;
  const all = state.aiSupp || (state.aiSupp = {});
  return all[side] || (all[side] = {});
}

/** 내 사격 결과 기록 (resolveAttack 끝): 시야 안에서 제압한 적 유닛 id 를 이번 라운드에 기억 */
function intelOnSuppress(state, attacker, events) {
  let vis = null;
  for (const ev of events) {
    if (ev.type !== 'suppressed' || ev.side === attacker.side) continue;
    vis = vis || getVisibleTiles(state, attacker.side);
    if (!vis.has(idx(ev.pos.r, ev.pos.c))) continue;
    suppMemory(state, attacker.side, true)[ev.unitId] = state.round;
  }
}

/** 이 사격이 (명중하면) 가져올 후퇴·제압 효과의 가치. 보이는 표적과 그 파편 칸의 적만 센다 */
function symV2RetreatGain(state, ctx, u, from, target, p) { return retreatGain(state, ctx, ctx.v2.V, u, from, target, p); }
/** 공통: V = { retreatKill, retreatClear, suppress, resuppressKill } 가중치 세트 */
function retreatGain(state, ctx, V, u, from, target, p) {
  const R = GAME_CONFIG.RETREAT, UV = GAME_CONFIG.AI.UNIT_VALUE;
  const t = unitType(u);
  const victims = [{ unit: target, splash: false, amount: t.fixedDamage != null ? t.fixedDamage : calcDamage(u, target) }];
  if (t.indirect && t.splash !== false) {
    for (const [dr, dc] of DIRS) {
      const o = getUnitAt(state, target.r + dr, target.c + dc);
      if (o && o.side !== u.side && ctx.vis.has(idx(o.r, o.c))) victims.push({ unit: o, splash: true, amount: GAME_CONFIG.COMBAT.splashDamage });
    }
  }
  let s = 0;
  for (const v of victims) {
    const o = v.unit;
    if (o.side === u.side || o.hp <= v.amount) continue;   // 아군 오사는 후퇴·제압 없음 · 피해로 격파되면 기존 항목이 셈
    const val = UV[o.type] || 1;
    if (t.indirect && !v.splash && R.SUPPRESS_SOURCES.includes(u.type)) {
      s += (symKnowsSuppressed(state, u.side, o.id) ? V.resuppressKill : V.suppress) * val * p;
      continue;
    }
    const out = symRetreatOutcome(state, ctx, u.side, o, retreatDir(from, o, target, t.indirect && v.splash));
    if (out.dies) { s += V.retreatKill * val * p; continue; }
    // 거점 수비 유닛을 밀어내 거점이 비면 (그 거점 안에 남는 같은 편이 없을 때)
    const obj = objectiveAt(state, o.r, o.c);
    if (obj && !objectiveCells(obj).some((q) => (q.r !== o.r || q.c !== o.c) && ctx.vis.has(idx(q.r, q.c)) && (getUnitAt(state, q.r, q.c) || {}).side === o.side)
        && !objectiveCells(obj).some((q) => q.r === out.to.r && q.c === out.to.c)) {
      const pts = GAME_CONFIG.OBJECTIVE_POINTS ? GAME_CONFIG.OBJECTIVE_POINTS[obj.id] || 1 : 1;
      s += V.retreatClear * pts * p;
    }
  }
  return s;
}

/** 맞았을 때 물러날 칸이 막힌 방향 수 (0~4): 맵 끝·이동 불가 지형·보이는 적. 아군은 지나갈 수 있으므로 막힘이 아님 */
function retreatBlockedCount(state, ctx, u, pos) {
  let blocked = 0;
  for (const [dr, dc] of DIRS) {
    const r = pos.r + dr, c = pos.c + dc;
    if (!inBounds(r, c)) { blocked++; continue; }
    const ter = terrainAt(r, c);
    if (ter.impassableFor && ter.impassableFor.includes(u.type)) { blocked++; continue; }
    const o = getUnitAt(state, r, c);
    if (o && o.side !== u.side && ctx.vis.has(idx(r, c))) blocked++;
  }
  return blocked;
}

/**
 * 기존 AI(호스토멜·춘천)의 위치 위험: 알려진 적(보이는 적 + 기억)이 다음 턴에 줄 기대 피해로 직접·간접을 나눠 센다.
 * 공통 함수가 쓰는 가중치 W = AI_CONFIG.WEIGHTS (noRetreat, suppressRisk). 호출하는 쪽이 diff.risk (난이도별 위험 회피 배수)를 곱한다.
 */
function aiRetreatRisk(state, ctx, W, u, pos) {
  const blocked = retreatBlockedCount(state, ctx, u, pos);
  const me = { ...u, r: pos.r, c: pos.c };
  const ter = terrainAt(pos.r, pos.c);
  let direct = 0, indirect = 0;
  for (const e of ctx.known) {
    const et = GAME_CONFIG.UNIT_TYPES[e.type];
    if (!et.canAttack) continue;
    const d = manhattan(e, pos);
    const R = et.indirect ? fireRange(state, enemyOf(u.side), e.type) : { min: et.rangeMin, max: et.rangeMax };
    if (et.indirect && !et.moveFire) { if (d < R.min || d > R.max) continue; }
    else if (d > et.move + R.max) continue;
    const hc = calcHitBreakdown({ attacker: e, defender: me, terrain: ter, signal: false, fogged: false, movedAttack: !(et.indirect && !et.moveFire) && d > R.max });
    const dmg = (hc.chance / 100) * Math.min(calcDamage(e, me), me.hp);
    if (et.indirect) indirect += dmg; else direct += dmg;
  }
  const hp = Math.max(1, u.hp);
  const mult = GAME_CONFIG.AI.UNIT_VALUE[u.type];
  return mult * (W.noRetreat * (blocked / 4) * Math.min(1, (direct + indirect) / hp) + W.suppressRisk * Math.min(1, indirect / hp));
}

/** 칸 pos 에 u 를 두었을 때의 후퇴·제압 위험 (감점 크기, 0 이상). loss: 그 칸의 기대 손실 비율, mult: 병종·체력 가중 */
function symV2RetreatRisk(state, ctx, u, pos, loss, mult) {
  const X = ctx.v2, V = X.V;
  const m = X.maps(u.type), i = idx(pos.r, pos.c);
  const blocked = retreatBlockedCount(state, ctx, u, pos);
  const exposure = Math.min(1, (m.direct[i] + 0.5 * m.artyP[i] * GAME_CONFIG.COMBAT.splashDamage) / Math.max(1, u.hp));
  const indirectLoss = Math.min(1, Math.max(0, m.dmg[i] - m.direct[i]));   // 간접 화력에 맞을 기대치 (제압 위험)
  return V.noRetreat * mult * (blocked / 4) * exposure + V.suppressRisk * mult * indirectLoss;
}

/** 공격 점수 추가 항목: 위협 제거, 마무리, 집중 사격. target 은 보이는 적 또는 기억으로 만든 가상 표적 */
function symV2Attack(state, ctx, u, target, p, kind = 'visible', from = u) {
  const X = ctx.v2, V = X.V;
  const rec = (target.id && X.recById.get(target.id)) || { type: target.type, r: target.r, c: target.c, hp: target.hp, conf: 1, radius: 0 };
  const ts = threatScore({ ...rec, hp: target.hp }, X.objCells, X.K);
  const t = unitType(u);
  const dmg = t.fixedDamage != null ? t.fixedDamage : calcDamage(u, target);
  let s = V.threatKill * ts * p * Math.min(dmg, target.hp) / target.hp;
  if (dmg >= target.hp) s += V.finish * p * (1 + ts);
  if (target.hp < GAME_CONFIG.MAX_HP) s += V.focus * p;
  // 간접 화력 사용 가산: 행동 한도 안에서 이동 후보에 밀려 포병·박격포가 놀지 않게 (표적 종류별, 오폭 감점은 기존 항목)
  // 파편이 있는 포병: 표적 옆에 아군이 있으면 가산 없음 + 아군 1기당 감점 (먼저 비켜 주는 이동은 symV2Position 의 clearLane)
  let adj = 0;
  if (t.indirect && t.splash !== false) for (const [dr, dc] of DIRS) { const a = getUnitAt(state, target.r + dr, target.c + dc); if (a && a.side === u.side) adj++; }
  if (t.indirect) s += adj ? -V.ffAdjacent * adj : (V.fireReady[kind] || 0) * (u.hp / GAME_CONFIG.MAX_HP);
  if (kind === 'visible') s += symV2RetreatGain(state, ctx, u, from, target, p);   // 후퇴 불가 격파·거점 비우기·제압 (retreat 규칙이 켜진 시나리오만)
  return s;
}

/**
 * 안개 속 사격 후보: 기억한 위치(신뢰도·불확실 반경 기준) + 올 가능성이 높은 칸(내가 점유하지 않은 거점 칸).
 * 보이는 칸·내 유닛 칸은 빼고, 가중 신뢰도가 높은 순으로 maxFogTargets 개까지
 */
function symV2FogTargets(state, ctx, u, inRange) {
  const X = ctx.v2, V = X.V;
  if (!blindFireAllowed(state, u.side)) return [];
  const out = [], seen = new Set();
  const ok = (r, c) => {
    const k = idx(r, c);
    if (seen.has(k) || ctx.vis.has(k) || !inRange({ r, c })) return false;
    const a = getUnitAt(state, r, c);
    return !(a && a.side === u.side);
  };
  for (const e of X.records) {
    if (e.seen || e.conf < V.fogMinConf || e.radius > V.fogMaxRadius || !ok(e.r, e.c)) continue;
    seen.add(idx(e.r, e.c));
    out.push({ r: e.r, c: e.c, kind: 'intel', id: e.id, type: e.type, hp: e.hp, conf: intelWeight(e, X.K) });
  }
  for (const o of state.objectives) {
    if (o.owner === u.side) continue;
    const conf = V.likelyConf * (o.owner === enemyOf(u.side) ? 2 : 1);   // 상대 점유 = 그 안에 상대 유닛이 있음 (공개 정보)
    for (const q of objectiveCells(o)) {
      if (!ok(q.r, q.c)) continue;
      seen.add(idx(q.r, q.c));
      out.push({ r: q.r, c: q.c, kind: 'likely', type: 'infantry', hp: GAME_CONFIG.MAX_HP, conf });
    }
  }
  out.sort((a, b) => b.conf - a.conf || a.r - b.r || a.c - b.c);
  return out.slice(0, V.maxFogTargets);
}

/* =====================================================================
   진단용 수비 봇 'turtle' (대칭 시나리오, simulateGames 프로필로만. 화면에는 없음). 결정적 (난수 없음)
   자기 쪽에서 가까운 거점 2곳 위·옆에 보병, 포병·박격포는 그 뒤 3~4칸에서 보이는 적을 쏨(오폭 우려가 있으면 건너뜀),
   정찰은 앞쪽, 기갑은 중앙 뒤 예비. 거점 3칸 안의 적은 집중 공격
   ===================================================================== */
function turtleTakeTurn(state, side, rng, opts = {}) {
  const C = GAME_CONFIG, AI = C.AI;
  const diceRng = opts.diceRng || rng;
  const actions = [];
  const anchor = sideAnchor(side), foe = sideAnchor(enemyOf(side));
  const dObj = (o, p) => Math.min(...objectiveCells(o).map((q) => manhattan(q, p)));
  const objs = state.objectives.slice().sort((a, b) => dObj(a, anchor) - dObj(b, anchor) || a.id.localeCompare(b.id)).slice(0, 2);
  const objCells = objs.flatMap((o) => objectiveCells(o));
  const nearObj = (p) => Math.min(...objCells.map((q) => manhattan(q, p)));
  const byId = (a, b) => a.id.localeCompare(b.id, 'en', { numeric: true });
  const record = (u, from, target, events) => actions.push({ unitId: u.id, side, unitType: u.type, from, to: { r: u.r, c: u.c }, target, events, moveSnapshot: null, snapshot: null });
  const visEnemies = () => { const vis = getVisibleTiles(state, side); return state.units.filter((e) => e.side !== side && vis.has(idx(e.r, e.c))); };
  const hitP = (u, e) => calcHitBreakdown({ attacker: u, defender: e, terrain: terrainAt(e.r, e.c), signal: hasSignalSupport(state, u), fogged: false, movedAttack: isMoveAttack(u), indirectPenalty: indirectPenaltyOf(state, u) }).chance / 100;
  const attack = (u, e, from, pre = []) => {
    if (!getAttackableTiles(state, u.id).some((p) => samePos(p, e))) return false;
    const events = [...pre, ...resolveAttack(state, u.id, { r: e.r, c: e.c }, diceRng)];
    if (getUnit(state, u.id)) finishUnit(state, u.id);
    record(u, from, { r: e.r, c: e.c, kind: 'visible' }, events);
    return true;
  };
  const stepToward = (u, goal) => {
    const field = distanceField(u.type, goal);
    let best = null, bestD = field[idx(u.r, u.c)];
    for (const t of getReachableTiles(state, u.id)) {
      const d = field[idx(t.r, t.c)];
      if (d < bestD) { best = t; bestD = d; }
    }
    return best;
  };
  // 1) 간접 화력: 보이는 적, 기대 피해가 가장 큰 표적. 포병은 표적 옆에 아군이 있으면 건너뜀
  for (const u of state.units.filter((x) => x.side === side && unitType(x).indirect).sort(byId)) {
    if (state.winner || !canUnitAttack(state, u)) continue;
    const t = unitType(u);
    let best = null, bestS = 0;
    for (const e of visEnemies()) {
      if (!inFireRange(state, u, u, e)) continue;
      if (t.splash !== false && DIRS.some(([dr, dc]) => { const a = getUnitAt(state, e.r + dr, e.c + dc); return a && a.side === side; })) continue;
      const dmg = t.fixedDamage != null ? t.fixedDamage : calcDamage(u, e);
      const sc = hitP(u, e) * Math.min(dmg, e.hp) * AI.UNIT_VALUE[e.type] * (nearObj(e) <= 3 ? 2 : 1) * (e.hp < C.MAX_HP ? 1.3 : 1);
      if (sc > bestS) { bestS = sc; best = e; }
    }
    if (best) attack(u, best, { r: u.r, c: u.c });
  }
  // 2) 직접 공격: 인접한 보이는 적 (거점 3칸 안 → 체력 낮은 순). 기갑은 거점 근처 적에게 이동 후 공격
  for (const u of state.units.filter((x) => x.side === side && unitType(x).canAttack && !unitType(x).indirect).sort(byId)) {
    if (state.winner || !getUnit(state, u.id) || !canUnitAttack(state, u)) continue;
    const foes = visEnemies().sort((a, b) => (nearObj(a) <= 3 ? 0 : 1) - (nearObj(b) <= 3 ? 0 : 1) || a.hp - b.hp || byId(a, b));
    let done = false;
    for (const e of foes) if (manhattan(u, e) === 1 && attack(u, e, { r: u.r, c: u.c })) { done = true; break; }
    if (done || u.type !== 'armor' || !canUnitMove(state, u)) continue;
    for (const e of foes.filter((x) => nearObj(x) <= 3)) {
      const spot = getReachableTiles(state, u.id).filter((t) => manhattan(t, e) === 1 && t.remaining >= attackCost(u.type))
        .sort((a, b) => b.remaining - a.remaining || a.r - b.r || a.c - b.c)[0];
      if (!spot) continue;
      const from = { r: u.r, c: u.c };
      const mv = moveUnit(state, u.id, { r: spot.r, c: spot.c });
      if (state.winner || !getUnit(state, u.id) || !samePos(u, spot) || !attack(u, e, from, mv)) {
        if (getUnit(state, u.id)) finishUnit(state, u.id);
        record(u, from, null, mv);
      }
      break;
    }
  }
  // 3) 자리 잡기: 보병·대전차 = 거점 칸과 옆 칸, 포병·박격포 = 주 거점 뒤 3~4칸, 통신 = 뒤 2칸, 정찰 = 앞 2칸, 기갑 = 뒤 2~3칸
  const slots = [];
  for (const q of objCells) slots.push(q);
  for (const q of objCells) for (const [dr, dc] of DIRS) {
    const p = { r: q.r + dr, c: q.c + dc };
    if (inBounds(p.r, p.c) && !slots.some((x) => samePos(x, p))) slots.push(p);
  }
  const taken = new Set();
  const mainCell = objectiveCells(objs[0])[0];
  const ringGoal = (u, lo, hi, towardFoe) => {
    let best = null, bestK = Infinity;
    for (let i = 0; i < N * N; i++) {
      const p = posOf(i);
      const d = manhattan(p, mainCell);
      if (d < lo || d > hi || taken.has(i)) continue;
      const ter = terrainAt(p.r, p.c);
      if (ter.impassableFor && ter.impassableFor.includes(u.type)) continue;
      const k = (towardFoe ? manhattan(p, foe) : manhattan(p, anchor)) * 1000 + i;
      if (k < bestK) { bestK = k; best = p; }
    }
    return best;
  };
  for (const u of state.units.filter((x) => x.side === side).sort(byId)) {
    if (state.winner || !getUnit(state, u.id) || u.acted || !canUnitMove(state, u)) continue;
    const t = unitType(u);
    let goal = null;
    if (u.type === 'infantry' || u.type === 'antitank') {
      const free = slots.filter((q) => !taken.has(idx(q.r, q.c)) && !(terrainAt(q.r, q.c).impassableFor || []).includes(u.type));
      const onObj = (q) => (objCells.some((x) => samePos(x, q)) ? 0 : 1);   // 거점 칸 먼저, 그다음 옆 칸
      free.sort((a, b) => onObj(a) - onObj(b) || manhattan(a, u) - manhattan(b, u) || a.r - b.r || a.c - b.c);
      goal = free[0] || null;
    } else if (t.indirect) goal = ringGoal(u, 3, 4, false);
    else if (t.isSignal) goal = ringGoal(u, 2, 2, false);
    else if (u.type === 'recon') goal = ringGoal(u, 2, 2, true);
    else if (u.type === 'armor') goal = ringGoal(u, 2, 3, false);
    if (!goal) continue;
    taken.add(idx(goal.r, goal.c));
    if (samePos(u, goal)) continue;
    const dest = stepToward(u, goal);
    if (!dest) continue;
    const from = { r: u.r, c: u.c };
    const events = moveUnit(state, u.id, { r: dest.r, c: dest.c });
    if (getUnit(state, u.id)) finishUnit(state, u.id);
    record(u, from, null, events);
  }
  return actions;
}

if (typeof module !== 'undefined' && module.exports) {
  Object.assign(module.exports, { symUrgency, symV2FogTargets, turtleTakeTurn, intelInit, intelRecords, intelArtyResting, intelEnemyCount, threatMap, expectedLoss, threatScore, intelSetupOf });
}
</script>
<script data-src="js/tutorial.js">
'use strict';
/* =====================================================================
   튜토리얼 로직 (DOM 없음, Node 테스트와 화면이 같이 씀)
   - 규칙 판정·주사위·안개는 엔진 함수(moveUnit, resolveAttack, endTurn, getVisibleTiles …)를 그대로 부른다.
     튜토리얼만의 규칙 분기는 없다. 이 파일은 단계 시작 상태, 허용 입력, 목표 진행, 정해진 상대 행동만 다룬다.
   - 단계 데이터: js/scenarios/tutorial.js 의 tutorialSteps
   ===================================================================== */
const TUTORIAL_ID = 'tutorial';
const PRACTICE_ID = 'tutorialPractice';

/** 단계 목록 (튜토리얼 시나리오 데이터) */
function tutorialSteps() {
  const s = findScenario(TUTORIAL_ID);
  return (s && s.tutorialSteps) || [];
}

/**
 * 단계 시작 상태. 호출 전에 loadScenario(TUTORIAL_ID) 가 되어 있어야 한다.
 * 일반 게임과 같은 createInitialState → 유닛·라운드만 setup 으로 바꾸고 → startTurn (행동 한도·화력·시야 기억은 엔진 그대로)
 */
function tutorialState(step) {
  const C = GAME_CONFIG, S = step.setup || {};
  const st = createInitialState();
  const n = {};
  st.units = (S.units || []).map((u) => {
    n[u.side] = (n[u.side] || 0) + 1;
    const unit = { id: u.side[0].toUpperCase() + n[u.side], side: u.side, type: u.type, r: u.pos[0], c: u.pos[1], hp: u.hp ?? C.MAX_HP, moved: false, acted: false };
    if (u.firedRound != null) unit.lastFiredRound = u.firedRound;
    return unit;
  });
  st.pending = [];
  st.round = S.round || 1;
  st.turn = C.PLAYER_SIDE;
  st.memory = Object.fromEntries(C.ROUND_ORDER.map((s) => [s, {}]));
  for (const o of st.objectives) o.owner = null;
  if (C.OBJECTIVE_CONTROL === 'presence') updateObjectiveControl(st);
  startTurn(st);
  if (S.actUsed && st.act) st.act.used = Math.max(0, Math.min(st.act.limit, S.actUsed < 0 ? st.act.limit + S.actUsed : S.actUsed));
  return st;
}

/** 칸 목록 일치: 'any' · 'fog'(이 진영 시야 밖) · 'obj:<id>'(거점 칸) · [[r,c], …] */
function tutorialCellMatch(list, at, st, side) {
  if (list == null || !at) return false;
  if (list === 'any') return true;
  if (list === 'fog') return !getVisibleTiles(st, side).has(idx(at.r, at.c));
  if (typeof list === 'string' && list.startsWith('obj:')) {
    const o = st.objectives.find((x) => x.id === list.slice(4));
    return !!o && objectiveCells(o).some((p) => samePos(p, at));
  }
  return Array.isArray(list) && list.some((p) => p[0] === at.r && p[1] === at.c);
}

/** 지금 진행할 목표 번호 (모두 끝났으면 goal.length) */
function tutorialCurrent(step, log, st) {
  const p = tutorialProgress(step, log, st);
  const k = p.done.indexOf(false);
  return k < 0 ? p.done.length : k;
}

/**
 * 허용된 입력인가. action: { kind: 'select'|'move'|'attack'|'preview'|'endTurn'|'cell'|'wait', unit?, at?:{r,c} }
 * ordered 단계는 지금 목표와 같은 종류의 입력만 (선택은 허용 목록이면 언제나)
 */
function tutorialAllows(step, action, st, log = []) {
  const A = step.allowedActions || {}, side = GAME_CONFIG.PLAYER_SIDE;
  const k = action.kind;
  let ok = false;
  if (k === 'select') ok = (A.select || []).includes(action.unit) || !!(A.move && A.move[action.unit]) || !!(A.attack && A.attack[action.unit]);
  else if (k === 'move') ok = !!A.move && tutorialCellMatch(A.move[action.unit], action.at, st, side);
  else if (k === 'attack' || k === 'preview') ok = !!A.attack && tutorialCellMatch(A.attack[action.unit], action.at, st, side);
  else if (k === 'endTurn') ok = !!A.endTurn;
  if (!ok || !step.ordered || k === 'select') return ok;
  const g = step.goal[tutorialCurrent(step, log, st)];
  if (!g) return k === 'preview';   // 끝난 뒤에는 상태를 더 바꾸지 않음 (확인 창 열기만)
  const same = g.do === k || (k === 'attack' && g.do === 'preview') || (k === 'preview' && g.do === 'attack');
  return same && (!g.unit || g.unit === action.unit);
}

/**
 * 입력 기록 (화면과 테스트가 같은 방식으로 남김). events: 그 입력으로 엔진이 낸 이벤트.
 * select 는 그 순간 행동 한도 소진·쿨다운 여부를 같이 남김. 이동으로 거점이 다툼이 되면 contested 를 남김
 */
function tutorialRecord(log, action, events, st) {
  const e = { ...action };
  if (action.kind === 'select') {
    const u = getUnit(st, action.unit);
    e.blocked = !!u && !u.acted && activationBlocked(st, u);
    e.cooling = !!u && onCooldown(st, u);
  }
  if ((action.kind === 'preview' || action.kind === 'attack') && action.at) e.fog = !getVisibleTiles(st, GAME_CONFIG.PLAYER_SIDE).has(idx(action.at.r, action.at.c));
  log.push(e);
  for (const ev of events || []) if (ev.type === 'objectiveLost' && ev.contested) log.push({ kind: 'contested', obj: ev.objectiveId });
  return log;
}

/** 목표별 완료 여부 { done:[bool], complete } (공격은 빗나가도 완료: 결과가 아니라 행동) */
function tutorialProgress(step, log, st) {
  const side = GAME_CONFIG.PLAYER_SIDE;
  const done = step.goal.map((g) => {
    switch (g.do) {
      case 'select': return log.some((e) => e.kind === 'select' && e.unit === g.unit);
      case 'selectBlocked': return log.some((e) => e.kind === 'select' && e.unit === g.unit && e.blocked);
      case 'selectCooldown': return log.some((e) => e.kind === 'select' && e.unit === g.unit && e.cooling);
      case 'move': return log.some((e) => e.kind === 'move' && e.unit === g.unit && (!g.at || tutorialCellMatch(g.at, e.at, st, side)));
      case 'attack': return log.some((e) => e.kind === 'attack' && e.unit === g.unit);
      case 'preview': return log.some((e) => (e.kind === 'preview' || e.kind === 'attack') && e.unit === g.unit && (!g.at ? true : g.at === 'fog' ? e.fog === true : tutorialCellMatch(g.at, e.at, st, side)));
      case 'endTurn': return log.some((e) => e.kind === 'endTurn');
      case 'contested': return log.some((e) => e.kind === 'contested' && e.obj === g.obj);
      case 'own': { const o = st.objectives.find((x) => x.id === g.obj); return !!o && o.owner === side; }
      default: return false;
    }
  });
  // 순서가 있는 단계: 앞 목표가 끝나야 뒤 목표도 끝난 것으로 셈
  if (step.ordered) for (let i = 1; i < done.length; i++) if (!done[i - 1]) done[i] = false;
  return { done, complete: done.every(Boolean) };
}

/** 지금 깜빡일 칸: 지금 목표의 유닛이 선택되지 않았으면 그 유닛 칸, 아니면 목표의 hl (없으면 단계 highlight) */
function tutorialHighlight(step, log, st, selectedId) {
  const g = step.goal[tutorialCurrent(step, log, st)];
  if (!g) return [];
  if (g.unit && g.do !== 'selectBlocked' && g.do !== 'selectCooldown' && selectedId !== g.unit) {
    const u = getUnit(st, g.unit);
    if (u) return [[u.r, u.c]];
  }
  if (g.do === 'selectBlocked' || g.do === 'selectCooldown') { const u = getUnit(st, g.unit); return u ? [[u.r, u.c]] : []; }
  return (g.hl || step.highlight || []).map((p) => [p[0], p[1]]);
}

/**
 * 턴 종료: 엔진 endTurn → (상대 턴) 단계의 정해진 행동(enemyScript)만 실행, AI 는 움직이지 않음 → endTurn.
 * 반환: 이벤트 목록 (화면은 일반 게임처럼 시야 기준으로 로그를 남김)
 */
function tutorialEndTurn(st, step, rng) {
  const events = endTurn(st);
  if (st.winner) return events;
  for (const a of step.enemyScript || []) {
    const u = getUnit(st, a.unit);
    if (!u || u.side !== st.turn) continue;
    const at = a.attack && { r: a.attack[0], c: a.attack[1] };
    if (at && getAttackableTiles(st, a.unit).some((p) => samePos(p, at))) events.push(...resolveAttack(st, a.unit, at, rng));   // 규칙상 안 되는 행동(쿨다운 등)은 건너뜀
    if (st.winner) return events;
  }
  events.push(...endTurn(st));
  return events;
}

/**
 * 코치 문구에 넣을 수치 (모두 규칙·시나리오 데이터에서 읽음). 규칙 값을 바꾸면 문구도 따라 바뀐다.
 * 대칭 전장 점수 설명은 그 시나리오의 공개 데이터(objectivePoints, scoreTiming)
 */
function tutorialParams() {
  const C = GAME_CONFIG, CB = C.COMBAT, F = C.FIRES || {}, UT = C.UNIT_TYPES;
  const ter = (ch) => C.TERRAIN[ch] || TERRAIN_TYPES[ch];
  const act = C.ACTIVATIONS ? C.ACTIVATIONS[roleOf(C.PLAYER_SIDE)] : null;
  const sym = findScenario('symmetric');
  const symPts = sym && sym.objectivePoints
    ? sym.objectives.map((o) => ({ t: 'tut.ptItem', p: { obj: { t: o.shortNameKey }, n: sym.objectivePoints[o.id] } }))
    : [];
  const fire = (type, k, d) => (F[type] && F[type][k] != null ? F[type][k] : d);
  return {
    act: act ?? '-',
    base: CB.baseHit, per: CB.perPoint, fog: Math.abs(CB.fogPenalty), mv: Math.abs(C.MOVE_ATTACK_PENALTY),
    min: CB.minHitD10, max: CB.maxHitD10, dice: C.DICE_SIDES, steps: C.RETREAT.STEPS,
    forest: ter('f').hitMod, plain: ter('.').hitMod, city: ter('#').hitMod,
    marsh: { t: terrainNameKey('paddy') },
    mMin: UT.mortar.rangeMin, mRange: fire('mortar', 'range', UT.mortar.rangeMax), mCd: fire('mortar', 'cooldown', 0), mDmg: UT.mortar.fixedDamage,
    aMin: UT.artillery.rangeMin, aRange: fire('artillery', 'range', UT.artillery.rangeMax), aCd: fire('artillery', 'cooldown', 0), splash: CB.splashDamage,
    pts: (C.OBJECTIVE_POINTS && C.OBJECTIVE_POINTS.T) ?? '-',
    symPts, symWhen: { t: sym && sym.scoreTiming === 'roundEnd' ? 'tut.when.roundEnd' : 'tut.when.ownTurn' },
  };
}

if (typeof module !== 'undefined' && module.exports) {
  Object.assign(module.exports, {
    TUTORIAL_ID, PRACTICE_ID, tutorialSteps, tutorialState, tutorialAllows, tutorialRecord, tutorialProgress,
    tutorialHighlight, tutorialEndTurn, tutorialParams, tutorialCurrent, tutorialCellMatch,
  });
}
</script>
<script data-src="js/zoom.js">
/* =====================================================================
   지도 확대/이동 (보기 전용). 게임 상태·규칙·안개와 무관한 순수 계산만 (DOM 없음)
   보기 상태 v = { z, tx, ty }: 지도 틀(라벨 포함)을 왼쪽 위 기준으로 z 배 키운 뒤 (tx, ty) px 만큼 옮김.
   화면 좌표 = 틀 좌표 × z + t. 틀 크기 w × h 는 배율 1 일 때의 크기이며 보이는 창(뷰포트)과 같음
   ===================================================================== */
const ZOOM = {
  minZoom: 1.0,       // 전체 보기 (기본, 이동 없음)
  maxZoom: 2.5,
  step: 1.25,         // + / − 버튼과 키 한 번
  wheelK: 0.0015,     // 휠 deltaY 1 당 배율 지수
  dragPx: 8,          // 누른 지점에서 이 거리(화면 px) 이상 움직이면 끌기 (칸 선택 안 함)
  animMs: 120,        // 확대/축소 보간 (150ms 이내)
};

const zoomIdentity = () => ({ z: 1, tx: 0, ty: 0 });
const clampZoom = (z) => Math.min(ZOOM.maxZoom, Math.max(ZOOM.minZoom, z));

/** 지도가 뷰포트를 항상 덮도록 이동 제한 (가장자리가 뷰포트 가장자리 안으로 들어오지 않음). 배율 1 이면 이동 없음 */
function clampPan(v, w, h) {
  const z = clampZoom(v.z);
  const clamp = (t, size) => Math.min(0, Math.max(size - size * z, t));
  return { z, tx: clamp(v.tx, w), ty: clamp(v.ty, h) };
}

/** 뷰포트 안의 점 (px, py) 가 가리키는 지도 지점을 고정한 채 배율을 z2 로 */
function zoomAt(v, z2, px, py, w, h) {
  const z = clampZoom(z2);
  const mx = (px - v.tx) / v.z, my = (py - v.ty) / v.z;
  return clampPan({ z, tx: px - mx * z, ty: py - my * z }, w, h);
}

/** 화면(뷰포트 기준) 좌표 ↔ 틀 좌표 */
const screenToFrame = (v, x, y) => ({ x: (x - v.tx) / v.z, y: (y - v.ty) / v.z });
const frameToScreen = (v, x, y) => ({ x: x * v.z + v.tx, y: y * v.z + v.ty });

/**
 * 뷰포트 좌표 → 칸 (지도 밖이면 null). geo = { ox, oy (틀 안에서 첫 칸의 왼쪽 위), cell, n }
 */
function pointToCell(v, x, y, geo) {
  const p = screenToFrame(v, x, y);
  const c = Math.floor((p.x - geo.ox) / geo.cell), r = Math.floor((p.y - geo.oy) / geo.cell);
  return r >= 0 && c >= 0 && r < geo.n && c < geo.n ? { r, c } : null;
}
/** 칸 중심의 뷰포트 좌표 */
function cellToPoint(v, r, c, geo) {
  return frameToScreen(v, geo.ox + (c + 0.5) * geo.cell, geo.oy + (r + 0.5) * geo.cell);
}

/** 누르기와 끌기 구분: 누른 지점에서 dragPx 이상 움직였으면 끌기 */
const isDrag = (dx, dy) => Math.hypot(dx, dy) >= ZOOM.dragPx;

/**
 * 틀 좌표의 사각형들(box: {x0, y0, x1, y1})이 모두 뷰포트 안(가장자리 여유 pad)에 보이도록 보기를 조정.
 * 지금 배율에서 들어가면 배율 유지·최소 이동, 안 들어가면 필요한 만큼만 축소 (1 까지)
 */
function fitBoxes(v, boxes, w, h, pad = 0) {
  if (!boxes.length) return clampPan(v, w, h);
  const x0 = Math.min(...boxes.map((b) => b.x0)), y0 = Math.min(...boxes.map((b) => b.y0));
  const x1 = Math.max(...boxes.map((b) => b.x1)), y1 = Math.max(...boxes.map((b) => b.y1));
  const z = clampZoom(Math.min(v.z, (w - 2 * pad) / Math.max(1, x1 - x0), (h - 2 * pad) / Math.max(1, y1 - y0)));
  const pan = (t, a, b, size) => {
    const lo = a * z + t, hi = b * z + t;   // 화면에서의 양 끝
    if (lo < pad) t += pad - lo;
    else if (hi > size - pad) t -= hi - (size - pad);
    return t;
  };
  return clampPan({ z, tx: pan(v.tx * (z / v.z), x0, x1, w), ty: pan(v.ty * (z / v.z), y0, y1, h) }, w, h);
}

if (typeof module !== 'undefined') Object.assign(module.exports, { ZOOM, zoomIdentity, clampZoom, clampPan, zoomAt, screenToFrame, frameToScreen, pointToCell, cellToPoint, isDrag, fitBoxes });
</script>
<script data-src="js/fx.js">
/**
 * 전투 효과 (화면 연출 전용). 규칙·판정·게임 난수와 무관하다.
 *  - planAttackFx: 엔진의 공격 이벤트 + 보는 사람의 시야 → 연출 목록 (순수 함수, Node 테스트 대상)
 *  - createFxCanvas: 연출 목록을 캔버스 입자로 그림 (브라우저 전용, ui.js 가 부름)
 * 좌표 단위는 칸 (칸 가운데 = c + 0.5). 시간 단위는 ms (화면에서 연출 속도 배율을 곱함).
 * 난수는 연출 전용 생성기(fxRng)만 쓴다. Math.random 과 게임 주사위 스트림은 건드리지 않는다.
 */

/* 색·크기·시간 상수 (크기 = 칸 배수). 바꿀 때는 여기만 */
const FX = {
  maxAttackMs: 1500,                 // 한 번의 공격 연출 상한 (발사~마지막 착탄 + 여운)
  cap: { pc: 400, phone: 150 },      // 동시 입자 수 상한
  fpsMin: 30, budgetMin: 0.3,        // 프레임이 이보다 느리면 입자 수를 자동으로 줄임 (하한 배수)
  rmParticles: 0.5,                  // 연출 줄이기: 입자 수 배수
  smokeAlphaMax: 0.6,                // 연기 한 덩이의 최대 불투명도 (겹쳐도 유닛이 비치게 입자 하나는 smokeAlpha)
  smokeAlpha: 0.3, dustAlpha: 0.5,
  push: 0.07,                        // 피격 유닛 밀림 (칸 배수, 약 2~3px)
  unitFlashMs: 200,
  splashGap: 100,                    // 포병 주변 4칸 확산 간격
  // 화면 흔들림 (px, ms). 크기는 발사 종류로만 정함 (거리·위치와 무관)
  shake: { mortarFire: { amp: 1.5, ms: 150 }, mortarLand: { amp: 2.5, ms: 200 }, artyFire: { amp: 4, ms: 300 }, artyLand: { amp: 6.5, ms: 400 } },
  color: {
    flash: '#ffd76a', flashEdge: '#ff8a1f', flashCore: '#ffffff', tracer: '#fff1a8', tracerHeavy: '#ffb02e', tracerEdge: '#7a4a00',
    smoke: '#8f8a80', smokeDark: '#5f5b55', dust: '#a08560', dirt: '#6f5a3e',
    spark: '#ffcf4d', sparkHot: '#fff2b0', blast: '#ff8a2a', blastCore: '#ffe27a', debris: '#4a3b2a',
    ring: '#f5e6c0', shell: '#2b2b2b', shadow: 'rgba(0,0,0,0.35)', hitWhite: '#ffffff', hitRed: '#ff3b30',
  },
  // 직접 사격 (병종별). shots: 연발 수, gap: 연발 간격, tracer: 탄도 굵기·비행 시간
  direct: {
    infantry: { shots: 3, gap: 100, flash: 0.2, smoke: 0.12, tracer: { w: 0.045, ms: 130, heavy: false, n: 3 }, hit: 'sparks', miss: 'dust', ms: 600, sfx: 'fire_rifle', hitSfx: 'hit_small' },
    antitank: { shots: 1, gap: 0, flash: 0.36, smoke: 0.2, backblast: true, tracer: { w: 0.11, ms: 170, heavy: true }, hit: 'blast', miss: 'dustBig', ms: 800, sfx: 'fire_at', hitSfx: 'hit_big' },
    armor: { shots: 1, gap: 0, flash: 0.4, smoke: 0.24, tracer: { w: 0.09, ms: 160, heavy: true }, hit: 'blastDebris', miss: 'dirt', ms: 800, sfx: 'fire_tank', hitSfx: 'hit_big' },
    light: { shots: 1, gap: 0, flash: 0.16, smoke: 0.08, tracer: { w: 0.035, ms: 140, heavy: false }, hit: 'sparksSmall', miss: 'dust', ms: 450, sfx: 'fire_rifle', hitSfx: 'hit_small' },
  },
  // 간접 사격. flight: [최소, 최대] 비행 시간, perCell: 거리 1칸당, apex: 포물선 높이(칸), fogLand: 시야 밖 발사일 때 착탄까지 고정 시간
  mortar: { flash: 0.24, smoke: 0.3, ring: 0.5, flight: [400, 700], perCell: 70, apex: 1.1, blast: 0.55, fogLand: 450 },
  artillery: { flash: 0.4, smoke: 0.55, ring: 0.9, flight: [500, 800], perCell: 55, apex: 1.8, blast: 0.8, nbBlast: 0.5, fogLand: 550 },
};
const FX_DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];   // 포병 주변 4칸 확산 순서 (위 → 오른쪽 → 아래 → 왼쪽)

/** 연출 전용 난수 (mulberry32). 게임 난수와 완전히 분리 */
function fxRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * 공격 연출 목록. ev = 엔진의 diceRoll 이벤트.
 * o = { me, vis: Set(칸 번호), N, dmg: [{pos, splash}](보이는 것만), dead: [{pos}](보이는 것만), splash: 포병 여부, rm: 연출 줄이기, seed }
 * 반환 { items: [{kind, at, ...}], shakes: [{at, amp, ms, kind}], units: [{pos, at, push}], sounds: [{id, at}], hitAt, end }
 * 안개: 발사(섬광·연기·고리)는 발사 칸이 보일 때만, 비행은 발사 칸이 보이고 (대상 칸이 보이거나 내 사격)일 때만,
 *       착탄은 대상 칸이 보이거나 내 사격일 때만 (내 사격이 안개 속에 떨어지면 명중 여부와 무관한 같은 폭발).
 *       흔들림은 내 발사 또는 보이는 착탄에만, 크기는 발사 종류로만. 밀림 방향은 발사 칸이 보일 때만.
 */
function planAttackFx(ev, o) {
  const items = [], shakes = [], units = [], sounds = [];   // sounds: [{ id, at }] 소리 시점 (그림과 같은 시야 분기에서만 만듦. 위치·거리 값 없음)
  const snd = (id, at) => sounds.push({ id, at: Math.round(at) });
  const R = fxRng(o.seed || 1);

          g.beginPath(); g.moveTo(p.x * k, p.y * k); g.lineTo((p.x - p.vx * 0.04) * k, (p.y - p.vy * 0.04) * k); g.stroke();

      } else if (p.kind === 'debris') {
        circle(p.x, p.y, p.size, col.debris, 1 - q * q);
      }
    }

  }
  return { play, clear, fit, canvas: cv, stats: () => ({ live: live.length, budget }) };
}

/* ---------- 포격 자국 (보기용. 엔진 상태·게임 난수와 무관, 화면 쪽 목록으로만 관리) ---------- */
const MARK_CFG = { perCell: 2, total: 40, jitter: 0.1, small: [0.55, 0.65], large: [0.8, 0.95] };

/**
 * 이 공격이 자국을 남기는가. 간접 화력이 명중했고 중심 칸이 보는 쪽 시야 안일 때만 {r,c,kind:'small'|'large'}, 아니면 null.
 * o = { vis: 시야 칸 집합(연출과 같은 것), N: 지도 한 변, small: 박격포(한 칸) 여부 }. 직접 사격·빗나감·안 보이는 칸은 남기지 않음
 */
function planImpactMark(ev, o) {
  if (!ev || !ev.indirect || !ev.hit || !o.vis.has(ev.target.r * o.N + ev.target.c)) return null;
  return { r: ev.target.r, c: ev.target.c, kind: o.small ? 'small' : 'large' };
}

/** 자국 하나의 모양: 판 연출 시드·라운드·칸·순번으로 정함 (효과 전용 난수. 같은 입력이면 같은 모양) */
function markShape(seed, round, mark, seq, files, cfg = MARK_CFG) {
  const rng = fxRng(((seed >>> 0) ^ Math.imul(round + 1, 0x9e3779b1) ^ Math.imul(mark.r * 64 + mark.c + 1, 0x85ebca6b) ^ Math.imul(seq + 1, 0xc2b2ae35)) >>> 0);
  const sz = cfg[mark.kind];
  return {
    r: mark.r, c: mark.c, kind: mark.kind, seq,
    file: files.length ? files[Math.floor(rng() * files.length) % files.length] : null,
    rot: Math.round(rng() * 360),
    dx: +((rng() * 2 - 1) * cfg.jitter).toFixed(3), dy: +((rng() * 2 - 1) * cfg.jitter).toFixed(3),
    size: +(sz[0] + rng() * (sz[1] - sz[0])).toFixed(3),
  };
}

/** 목록에 추가: 칸마다 최대 perCell 개(넘으면 그 칸의 가장 오래된 것), 판 전체 최대 total 개(넘으면 가장 오래된 것). 새 목록을 돌려줌 */
function addMark(list, shape, cfg = MARK_CFG) {
  let out = [...list, shape];
  const same = out.filter((m) => m.r === shape.r && m.c === shape.c);
  if (same.length > cfg.perCell) { const drop = new Set(same.slice(0, same.length - cfg.perCell)); out = out.filter((m) => !drop.has(m)); }
  if (out.length > cfg.total) out = out.slice(out.length - cfg.total);
  return out;
}

if (typeof module !== 'undefined' && module.exports) Object.assign(module.exports, { FX, fxRng, planAttackFx, MARK_CFG, planImpactMark, markShape, addMark });

<script data-src="js/menu.js">
/**
 * 메뉴 구성 (순수 계산, DOM 없음). 화면은 ui.js 의 showMenu / showIntro 가 그린다.
 *  - 게임 제목: STRINGS 의 'gameTitle', 'gameSubtitle' 한 곳 (언어별). 탭 제목·설명 메타도 같은 값
 *  - readMenuStore: 저장소에서 메뉴에 필요한 것만 읽음. 못 읽으면 "저장 없음, 처음 아님"

 */
const MENU_KEYS = { tutorial: 'chuncheon1950.tutorial', records: 'chuncheon1950.gameRecords', save: 'chuncheon1950.savedGame', rulesNotice: 'chuncheon1950.rulesNotice' };

/**
 * getStorage(): localStorage 를 돌려주는 함수 (접근 자체가 오류를 낼 수 있어 함수로 받음).
 * 반환 { ok, firstRun, save }. save 는 공개 정보만: { scenarioId, round, maxRounds, mode, turn(2인 대전만) } 또는 null
 */
function readMenuStore(getStorage) {
  try {
    const st = getStorage();
    const J = (k) => { const v = st.getItem(k); return v ? JSON.parse(v) : null; };
    const tut = J(MENU_KEYS.tutorial) || {};
    const rec = J(MENU_KEYS.records) || {};
    const played = Object.values(rec).some((list) => Array.isArray(list) && list.length > 0);
    const seenTut = !!tut.seen || (Array.isArray(tut.done) && tut.done.length > 0);
    let save = null;
    const s = J(MENU_KEYS.save);
    if (s && typeof s.scenarioId === 'string' && Number.isInteger(s.round) && Number.isInteger(s.maxRounds)) {
      const mode = s.mode === 'hotseat' ? 'hotseat' : 'ai';
      // rulesUpdated: 지금 규칙보다 앞선 버전(또는 버전 기록 없음)으로 저장된 판 → 이어하기 때 규칙 업데이트 안내 (upgradeSavedState)
      const rulesUpdated = !(Number.isInteger(s.rulesVersion) && s.rulesVersion >= RULES.RULES_VERSION);
      save = { scenarioId: s.scenarioId, round: s.round, maxRounds: s.maxRounds, mode, turn: mode === 'hotseat' && typeof s.turn === 'string' ? s.turn : null, rulesUpdated };
    }
    return { ok: true, firstRun: !seenTut && !played && !save, save };
  } catch (e) {
    return { ok: false, firstRun: false, save: null };
  }
}

/** 이어하기 때 '규칙이 업데이트되어 후퇴와 제압이 적용됩니다' 안내를 보여야 하는가: 옛 규칙으로 저장된 판이고, 이 규칙 버전의 안내를 아직 안 봤을 때 (한 번만) */
function rulesNoticeNeeded(save, seenVersion) {
  return !!save && !!save.rulesUpdated && !(Number.isInteger(seenVersion) && seenVersion >= RULES.RULES_VERSION);
}

/**
 * 메인 메뉴의 큰 버튼. o = { save, firstRun, tutorialSteps }
 * 반환 { items: [{ id: 'continue'|'new'|'tutorial', primary }], secondary: ['rules', 'settings'] }
 *  - 저장 판이 있으면 이어하기가 맨 위·강조
 *  - 저장 판이 없고 처음 실행이면 튜토리얼이 맨 위·강조, 아니면 새 게임이 강조

function menuModel(o) {
  const hasTut = (o.tutorialSteps || 0) > 0;
  const ids = [];
  if (o.save) ids.push('continue', 'new');
  else if (o.firstRun && hasTut) ids.push('tutorial', 'new');
  else ids.push('new');

}

/** 시나리오 카드: 이름·한 줄 설명·태그는 시나리오 데이터에서 (summaryKey 가 있으면 그것, 없으면 descKey) */
function scenarioCardModel(sc) {
  return {
    id: sc.id,
    nameKey: sc.nameKey,
    descKey: sc.summaryKey || sc.descKey,
    tagKeys: (sc.tags || []).slice(0, 3).map((k) => 'tag.' + k),
    hasArt: !!(sc.art && sc.art.terrain),
  };
}

if (typeof module !== 'undefined' && module.exports) Object.assign(module.exports, { MENU_KEYS, readMenuStore, menuModel, scenarioCardModel, rulesNoticeNeeded });
</script>
<script data-src="js/audio.js">
/**
 * 소리 관리자 (화면 전용. 규칙·판정·게임 난수와 무관).
 *  - AUDIO: 소리 목록(논리 이름 → sound/ 의 실제 파일), 동시 재생 상한, 기본 볼륨 등 상수
 *  - createAudio(env): 로드·재생·볼륨·음소거·동시 재생 제한·BGM 반복. env 로 AudioContext·fetch·저장소를 받아 테스트에서 바꿔 끼움
 *  - 소리 크기는 소리 종류(AUDIO.gain)와 사용자 볼륨으로만 정함. 거리·위치·좌우·음높이 변화 없음 (정보가 새지 않게)
 *  - 변형 파일 고르기는 소리 전용 난수(audioRng). Math.random 과 게임 주사위 스트림은 쓰지 않음
 *  - 언제 어떤 소리를 낼지는 연출 시간표(js/fx.js planAttackFx 의 sounds)가 같은 시야 판정으로 정함
 */
const AUDIO = {
  dir: 'sound/',
  exts: ['m4a', 'mp3', 'wav'],        // 이 순서로 찾음 (files 에 확장자를 적은 항목은 그 파일만)
  maxVoices: 8, maxSame: 3,           // 동시 재생 상한: 전체, 같은 소리
  dedupeMs: 50,                       // 같은 소리를 이 시간 안에 또 부르면 한 번만
  fadeOutMs: 80,                      // 상한을 넘겨 끌 때·이동 소리를 끝낼 때
  bgmFadeMs: 1000,
  volume: { music: 0.5, sfx: 0.8 },   // 사용자 볼륨 기본값 (0~1)
  musicCeil: 0.6,                     // 음악 최대치 (효과음을 덮지 않게 효과음보다 낮음)
  storeKey: 'chuncheon1950.audio',
  // 논리 이름 → 파일(변형이 여러 개면 재생할 때마다 무작위, 직전 것은 피함). 확장자가 없으면 exts 순서로 찾음.
  // 파일이 아직 없는 소리는 빈 목록: 파일을 sound/ 에 넣고 여기에 이름을 적으면 바로 나옴
  files: {
    ui_click: ['ui_click.wav'], ui_cancel: ['ui_cancel.wav'], ui_error: ['ui_error.wav'], ui_turn_end: ['ui_turn_end.wav'],
    fire_rifle: ['fire_rifle.wav'], fire_tank: ['fire_tank.wav'], fire_at: ['fire_at.wav'],
    hit_small: ['hit_small.wav'], hit_big: ['hit_big.wav'], miss_dirt: ['miss_dirt.wav'],
    mortar_fire: ['motar_fire.wav'], mortar_impact: ['moratr_impact.wav'],        // 실제 파일 이름 그대로 (철자 주의)
    artillery_fire: ['artillery_fire.wav'], artillery_impact: ['artillery_impact.wav'],
    unit_destroyed: ['unit_destroyed.wav'],
    move_infantry: ['move_infantry.wav'], move_vehicle: ['move_vehicle.wav'],
    shell_whistle: [], score_up: [], objective_captured: [], victory: [], defeat: [],
  },
  // 로딩 순서: UI → 전투 핵심 → 나머지
  loadOrder: ['ui_click', 'ui_cancel', 'ui_error', 'ui_turn_end',
    'fire_rifle', 'fire_tank', 'fire_at', 'hit_small', 'hit_big', 'miss_dirt', 'mortar_fire', 'mortar_impact', 'artillery_fire', 'artillery_impact',
    'unit_destroyed', 'move_infantry', 'move_vehicle', 'shell_whistle', 'score_up', 'objective_captured', 'victory', 'defeat'],
  gain: {},                           // 소리별 크기 보정 (기본 1). 종류로만 정함
  vehicleTypes: ['armor', 'recon', 'signal', 'artillery'],   // 이동 소리: 이 병종은 move_vehicle, 나머지는 move_infantry
  menuBgm: null,                      // 메뉴·시나리오 선택 화면 음악 (예: 'sound/bgm_menu'). 파일이 없으면 null

/** 소리 전용 난수 (게임 난수와 분리) */
function audioRng(seed) {
  let a = (seed >>> 0) || 0x1234567;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;

    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);

/**
 * env = {
 *   makeContext(): AudioContext 또는 null,  fetchFile(url): Promise<ArrayBuffer|null> (없으면 null, 읽기 자체가 막히면 throw),
 *   makeElement(url): HTMLAudioElement 대체 경로용 (없어도 됨),  now(): ms,  store: { get(), set(v) } (실패해도 됨),  warn(msg),  seed
 * }
 */
function createAudio(env) {
  const A = AUDIO;
  const rng = audioRng(env.seed || 1);
  const now = env.now || (() => Date.now());
  const warn = env.warn || (() => {});
  const S = { musicOn: true, sfxOn: true, music: A.volume.music, sfx: A.volume.sfx, muted: false };
  try { const v = env.store && env.store.get(); if (v && typeof v === 'object') for (const k of Object.keys(S)) if (typeof v[k] === typeof S[k]) S[k] = v[k]; } catch (e) { /* 저장소를 못 읽어도 기본값으로 */ }
  const clamp01 = (x) => Math.max(0, Math.min(1, Number(x) || 0));
  S.music = clamp01(S.music); S.sfx = clamp01(S.sfx);
  const save = () => { try { if (env.store) env.store.set({ ...S }); } catch (e) { /* 저장 불가: 이 세션 안에서만 */ } };

  let ctx = null, sfxBus = null, musicBus = null, unlocked = false, hidden = false, useElements = false;
  const bank = new Map();      // 파일 경로 → { state: 'loading'|'ready'|'missing', buffer | el }
  const lastVar = new Map();   // 논리 이름 → 직전에 쓴 변형 번호
  const lastAt = new Map();    // 논리 이름 → 직전 재생 시각
  const voices = [];           // 재생 중 { id, t, stop(fadeMs), done }
  const bgm = { want: null, trim: [0, 0], cur: null, token: 0 };
  let loading = Promise.resolve();   // 효과음 로딩 (테스트에서 기다릴 때)

  const sfxLevel = () => (S.muted || !S.sfxOn ? 0 : S.sfx);
  const musicLevel = () => (S.muted || !S.musicOn ? 0 : S.music * A.musicCeil);
  function applyLevels() {
    if (sfxBus) sfxBus.gain.value = sfxLevel();
    if (musicBus) musicBus.gain.value = musicLevel();
    for (const v of voices) if (v.el) v.el.volume = clamp01(sfxLevel() * v.g);
    if (bgm.cur && bgm.cur.el) bgm.cur.el.volume = clamp01(musicLevel());
  }

  /** 파일 하나 읽기. names: 시도할 경로들 (확장자 순). 끝나면 { buffer } | { el } | null */
  async function loadFirst(names) {
    for (const url of names) {
      if (bank.has(url)) { const b = bank.get(url); if (b.state === 'ready') return b; if (b.state === 'missing') continue; }
      bank.set(url, { state: 'loading' });

        let entry = null;
        if (!useElements && ctx) {
          let data;

          if (data) entry = { state: 'ready', buffer: await ctx.decodeAudioData(data) };

        }

      } catch (e) { /* 디코딩 실패: 다음 후보 */ }
      bank.set(url, { state: 'missing' });
    }
    return null;
  }
  const candidates = (name) => (/\.[a-z0-9]+$/i.test(name) ? [A.dir + name] : A.exts.map((x) => `${A.dir}${name}.${x}`));
  const pathCandidates = (p) => (/\.[a-z0-9]+$/i.test(p) ? [p] : A.exts.map((x) => `${p}.${x}`));
  const ready = new Map();     // 논리 이름 → [읽힌 항목] (변형)
  async function loadAll() {
    for (const id of A.loadOrder) {
      const list = A.files[id] || [];
      const got = [];
      for (const name of list) {
        const e = await loadFirst(candidates(name));
        if (e) got.push(e); else warn(`[audio] ${id}: ${name} 을(를) 읽지 못했습니다 (소리 없이 진행)`);
      }
      ready.set(id, got);
    }
  }

  /** 처음 터치·클릭 때 한 번: 소리 시스템 시작 + 로딩. 그 전의 재생 요청은 무시됨 */
  function unlock() {
    if (unlocked) { if (ctx && ctx.state === 'suspended' && !hidden) { try { ctx.resume(); } catch (e) { /* 무시 */ } } return; }
    unlocked = true;
    try { ctx = env.makeContext ? env.makeContext() : null; } catch (e) { ctx = null; }
    if (ctx) {
      try {
        sfxBus = ctx.createGain(); musicBus = ctx.createGain();
        sfxBus.connect(ctx.destination); musicBus.connect(ctx.destination);
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) { ctx = null; sfxBus = musicBus = null; }
    }
    if (!ctx) useElements = true;
    applyLevels();
    loading = loadAll().catch(() => {});
    if (bgm.want) startBgm();
  }

  function dropVoice(v) { const i = voices.indexOf(v); if (i >= 0) voices.splice(i, 1); }
  /** 효과음 재생. 못 내는 상황(잠김·꺼짐·아직 안 읽힘·없는 파일·중복)은 null. 위치·거리 인자는 없음 */
  function play(id) {
    if (!unlocked || hidden || sfxLevel() <= 0) return null;
    const list = ready.get(id);
    if (!list || !list.length) return null;
    const t = now();
    if (lastAt.has(id) && t - lastAt.get(id) < A.dedupeMs) return null;
    lastAt.set(id, t);
    // 상한: 같은 소리 maxSame, 전체 maxVoices. 넘으면 가장 오래된 것을 줄여서 끔
    const same = voices.filter((v) => v.id === id);
    if (same.length >= A.maxSame) same[0].stop(A.fadeOutMs);
    if (voices.length >= A.maxVoices) voices[0].stop(A.fadeOutMs);
    let k = 0;
    if (list.length > 1) { do { k = Math.floor(rng() * list.length); } while (k === lastVar.get(id)); }
    lastVar.set(id, k);
    const entry = list[k], g = A.gain[id] == null ? 1 : A.gain[id];
    const v = { id, t, g, done: false };
    try {
      if (entry.buffer && ctx) {

      } else if (entry.el) {
        const el = entry.el.cloneNode(true);
        el.volume = clamp01(sfxLevel() * g);
        v.el = el;
        v.stop = () => { if (v.done) return; v.done = true; dropVoice(v); try { el.pause(); } catch (e) { /* 무시 */ } };
        el.onended = () => { v.done = true; dropVoice(v); };
        const p = el.play();
        if (p && p.catch) p.catch(() => { v.done = true; dropVoice(v); });
      } else return null;
    } catch (e) { return null; }
    voices.push(v);
    return v;
  }
  function stopVoice(v, fadeMs = A.fadeOutMs) { if (v && v.stop) v.stop(fadeMs); }

    const inPatch = (r, c) => patches.some((p) => r >= p.rows[0] && r <= p.rows[1] && c >= p.cols[0] && c <= p.cols[1]);

    // 1. 평지 바탕 (전체)
    ctx.drawImage(mirrored(tex('plain'), S, tileOf('plain'), offOf('plain')), 0, 0);

    // 1b. 마른 밭 · 밀밭 (art 가 켠 시나리오만): 평지 칸 위에만, 습지·숲·강·마을은 아래에서 다시 덮음
    const decorImg = o.img.decor || {};
    const plainMask = cellMask(n, R, (r, c) => key(r, c) === 'plain');
    const plainSoft = blur(plainMask, W, W, 0.06 * R);
    if (o.art.dryField && decorImg[o.art.dryField.src]) {
      const nz = noise2(W, W, K.dry.period * R, rnd);
      const t = quantileIn(nz, plainMask, o.art.dryField.share == null ? 0.3 : o.art.dryField.share);
      const al = new Float32Array(W * W);
      for (let i = 0; i < al.length; i++) al[i] = smooth(t - K.dry.edge, t + K.dry.edge, nz[i]) * plainSoft[i];
      drawMasked(ctx, mirrored(decorImg[o.art.dryField.src], S, tileOf('plain'), offOf('plain')), alphaCanvas(al, W, W, [0, 0, 0]), S);
    }
    for (const f of o.art.fields || []) {
      const im = decorImg[f.src];
      if (!im) continue;
      const FD = K.field;
      const base = cellMask(n, R, (r, c) => r >= f.rows[0] && r <= f.rows[1] && c >= f.cols[0] && c <= f.cols[1] && key(r, c) === 'plain');
      const b = blur(base, W, W, FD.blur * R), nz = noise2(W, W, FD.noisePeriod * R, rnd), al = new Float32Array(W * W);
      for (let i = 0; i < al.length; i++) {
        const v = b[i] + (nz[i] - 0.5) * FD.amp * Math.min(1, b[i] * 3) * Math.min(1, (1 - b[i]) * 3 + 0.1);
        al[i] = smooth(0.5 - FD.edge, 0.5 + FD.edge, v) * plainSoft[i];   // 평지 밖으로는 번지지 않음
      }
      const layer = tinted(mirrored(im, S, FD.tile * cellPx, offOf('plain')), f.saturation == null ? 0.55 : f.saturation, f.brightness == null ? 0.85 : f.brightness);
      drawMasked(ctx, layer, alphaCanvas(al, W, W, [0, 0, 0]), S);
    }

    // 2. 습지
    const paddy = cellMask(n, R, (r, c) => key(r, c) === 'paddy');
    if (paddy.some((v) => v)) drawMasked(ctx, mirrored(tex('paddy'), S, tileOf('paddy'), offOf('paddy')), alphaCanvas(blur(paddy, W, W, K.blur.paddy * R), W, W, [0, 0, 0]), S);

    // 3. 강: 모래빛 강둑 → 물
    const river = cellMask(n, R, (r, c) => key(r, c) === 'river');
    const iv = Math.round(K.riverInset * R);   // 강이 아닌 이웃 쪽 가장자리를 깎음 → 물길이 칸보다 조금 좁고 끝이 둥글게
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (key(r, c) !== 'river') continue;
      const cut = (x0, x1, y0, y1) => { for (let y = y0; y < y1; y++) river.fill(0, y * W + x0, y * W + x1); };
      if (c === 0 || key(r, c - 1) !== 'river') cut(c * R, c * R + iv, r * R, (r + 1) * R);
      if (c === n - 1 || key(r, c + 1) !== 'river') cut((c + 1) * R - iv, (c + 1) * R, r * R, (r + 1) * R);
      if (r > 0 && key(r - 1, c) !== 'river') cut(c * R, (c + 1) * R, r * R, r * R + iv);
      if (r < n - 1 && key(r + 1, c) !== 'river') cut(c * R, (c + 1) * R, (r + 1) * R - iv, (r + 1) * R);
    }
    if (river.some((v) => v)) {
      const d = distOutside(river, W, W), bw = K.bank.width * R;
      const bank = new Float32Array(W * W);
      for (let i = 0; i < bank.length; i++) bank[i] = d[i] === 0 ? 1 : 1 - smooth(bw * 0.6, bw, d[i]);
      ctx.drawImage(alphaCanvas(blur(bank, W, W, 0.03 * R), W, W, K.bank.rgb, K.bank.alpha), 0, 0, S, S);
      drawMasked(ctx, mirrored(tex('river'), S, tileOf('river'), offOf('river')), alphaCanvas(blur(river, W, W, K.blur.river * R), W, W, [0, 0, 0]), S);
    }

    // 4. 숲: 주변 평지에 부드러운 그림자 → 숲
    const forest = cellMask(n, R, (r, c) => key(r, c) === 'forest');
    if (forest.some((v) => v)) {
      const F = K.forestShadow;
      ctx.drawImage(alphaCanvas(blur(forest, W, W, F.blur * R), W, W, [0, 0, 0], F.alpha), F.dx * cellPx, F.dy * cellPx, S, S);
      drawMasked(ctx, mirrored(tex('forest'), S, tileOf('forest'), offOf('forest')), alphaCanvas(blur(forest, W, W, K.blur.forest * R), W, W, [0, 0, 0]), S);
    }

    // 5. 도심(마을): 울퉁불퉁한 알파 + 끊긴 흙색 띠 + 옅은 풀 변색 + 근처 덤불
    const V = K.village;
    const drawVillage = (base, layerCv, bushCount) => {
      const sh = villageShape(base, W, R, rnd);
      ctx.drawImage(alphaCanvas(sh.grass, W, W, V.grass.rgb, V.grass.alpha), 0, 0, S, S);
      ctx.drawImage(alphaCanvas(sh.band, W, W, V.dirt.rgb, V.dirt.alpha), 0, 0, S, S);
      drawMasked(ctx, layerCv, alphaCanvas(sh.alpha, W, W, [0, 0, 0]), S);
      ctx.drawImage(alphaCanvas(sh.rim, W, W, V.rim.rgb, V.rim.alpha), 0, 0, S, S);
      if (bushCount > 0) drawBushes(ctx, tex('forest'), sh.dist, W, R, unit, bushCount, rnd);
    };
    let cityCells = 0;
    const city = cellMask(n, R, (r, c) => { const on = key(r, c) === 'city' && !inPatch(r, c); if (on) cityCells++; return on; });
    if (cityCells) drawVillage(city, mirrored(tex('city'), S, tileOf('city'), offOf('city')), Math.round(cityCells * V.bushes.perCell));

    // 6. 공항 건물 조각 (칸 영역보다 pad 만큼 크게)
    for (const p of patches) {
      const im = o.img.patch;
      if (!im) continue;
      const pad = p.pad == null ? 0.1 : p.pad;
      const x0 = (p.cols[0] - pad) * cellPx, y0 = (p.rows[0] - pad) * cellPx;
      const w = (p.cols[1] - p.cols[0] + 1 + 2 * pad) * cellPx, h = (p.rows[1] - p.rows[0] + 1 + 2 * pad) * cellPx;
      const lay = newCanvas(S, S);
      lay.getContext('2d').drawImage(im, x0, y0, w, h);
      const base = new Float32Array(W * W);
      for (let y = Math.max(0, Math.round((p.rows[0] - pad) * R)); y < Math.min(W, Math.round((p.rows[1] + 1 + pad) * R)); y++) {
        for (let x = Math.max(0, Math.round((p.cols[0] - pad) * R)); x < Math.min(W, Math.round((p.cols[1] + 1 + pad) * R)); x++) base[y * W + x] = 1;
      }
      drawVillage(base, lay, Math.round((p.rows[1] - p.rows[0] + 1) * (p.cols[1] - p.cols[0] + 1) * V.bushes.perCell * 0.5));
    }

    // 6b. 줄·자국 장식 (art.decor: 방풍림·흙길·포격 자국. 규칙과 무관한 바탕 그림이라 유닛·선택·거점 표시보다 아래층)
    for (const d of o.art.decor || []) {
      const im = decorImg[d.src];
      if (!im) continue;
      if (d.type === 'strip') {
        const a = { x: (d.from[1] + 0.5) * cellPx, y: (d.from[0] + 0.5) * cellPx }, e = { x: (d.to[1] + 0.5) * cellPx, y: (d.to[0] + 0.5) * cellPx };
        const len = Math.hypot(e.x - a.x, e.y - a.y) + cellPx, ang = Math.atan2(e.y - a.y, e.x - a.x);   // 첫·끝 칸을 모두 덮는 길이
        const mx = (a.x + e.x) / 2, my = (a.y + e.y) / 2, w = len, h = len * im.height / im.width;
        const put = (c2, ox, oy) => { c2.save(); c2.translate(mx + ox, my + oy); c2.rotate(ang); c2.drawImage(im, -w / 2, -h / 2, w, h); c2.restore(); };
        if (d.shadow) {
          const SH = K.strip.shadow, lay = newCanvas(S, S), lx = lay.getContext('2d');
          put(lx, 0, 0);
          lx.globalCompositeOperation = 'source-in';
          lx.fillStyle = '#000';
          lx.fillRect(0, 0, S, S);
          ctx.save();
          ctx.globalAlpha = SH.alpha;
          if ('filter' in ctx) ctx.filter = `blur(${SH.blur * cellPx}px)`;
          ctx.drawImage(lay, SH.dx * cellPx, SH.dy * cellPx);
          ctx.restore();
        }
        put(ctx, 0, 0);
      } else if (d.type === 'scar') {
        const w = d.size * cellPx / (d.fill || 1), h = w * im.height / im.width;
        ctx.save();
        ctx.globalAlpha = K.scar.alpha;
        ctx.translate((d.at[1] + 0.5) * cellPx, (d.at[0] + 0.5) * cellPx);
        ctx.rotate((d.rot || 0) * Math.PI / 180);
        ctx.drawImage(im, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
    }

    // 7. 활주로 (규칙상 표식일 뿐: 이동·지형·시야와 무관)
    if (o.img.runway) {
      const im = o.img.runway, RW = K.runway;
      for (const rw of o.runways || []) {
        const x0 = (rw.col + RW.inset) * cellPx, w = (1 - 2 * RW.inset) * cellPx;
        const y0 = rw.rows[0] * cellPx, y1 = (rw.rows[1] + 1) * cellPx, piece = 2 * w;
        for (let y = y0; y < y1 - 0.5; y += piece) {
          const h = Math.min(piece, y1 - y);
          ctx.drawImage(im, 0, 0, im.width, im.height * (h / piece), x0, y, w, h);
        }
        ctx.strokeStyle = RW.edge;
        ctx.lineWidth = Math.max(1, cellPx * 0.018);
        ctx.strokeRect(x0 + ctx.lineWidth / 2, y0 + ctx.lineWidth / 2, w - ctx.lineWidth, y1 - y0 - ctx.lineWidth);
        // 문턱 표지: 위아래 끝에 흰 줄무늬 4개씩
        ctx.fillStyle = 'rgba(245,245,240,0.9)';
        const bw = w / (RW.bars * 2 + 1), bl = RW.barLen * cellPx, gap = RW.barGap * cellPx;
        for (let k = 0; k < RW.bars; k++) {
          const bx = x0 + bw * (1 + 2 * k);
          ctx.fillRect(bx, y0 + gap, bw, bl);
          ctx.fillRect(bx, y1 - gap - bl, bw, bl);
        }
      }
    }

    // 8. 마무리: 비네트 + 필름 입자
    const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.38, S / 2, S / 2, S * 0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${K.vignette})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    const GS = 128, gc = newCanvas(GS, GS), gx = gc.getContext('2d'), gi = gx.createImageData(GS, GS);
    for (let i = 0; i < GS * GS; i++) { const v = 128 + Math.round((rnd() * 2 - 1) * K.grain); gi.data[i * 4] = gi.data[i * 4 + 1] = gi.data[i * 4 + 2] = v; gi.data[i * 4 + 3] = 255; }
    gx.putImageData(gi, 0, 0);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = ctx.createPattern(gc, 'repeat');
    ctx.fillRect(0, 0, S, S);
    ctx.globalCompositeOperation = 'source-over';
  }

  /** art 에 나오는 이미지 경로 목록 (불러오기용) */
  function artSources(art, unitFiles) {
    const out = [];
    for (const [k, src] of Object.entries(art.terrain || {})) out.push({ kind: 'terrain', key: k, src });
    for (const ov of art.overlays || []) if (ov.src) out.push({ kind: ov.type, key: ov.type, src: ov.src });
    const seen = new Set();   // 장식 그림 (마른 밭·밀밭·줄·자국): 같은 파일은 한 번만 불러옴
    for (const v of [art.dryField, ...(art.fields || []), ...(art.decor || [])]) {
      if (v && v.src && !seen.has(v.src)) { seen.add(v.src); out.push({ kind: 'decor', key: v.src, src: v.src }); }
    }
    for (const [type, file] of Object.entries(unitFiles)) out.push({ kind: 'unit', key: type, src: `assets/units/${art.unitSet}/${file}.png` });
    return out;
  }

  return { paint, artSources, K };
})();
</script>
